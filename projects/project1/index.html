<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Interactive Brand Showcase</title>
<link rel="stylesheet" href="../../assets/css/style.css"/>
<style>
section.panel{height:100vh; display:flex; align-items:center; justify-content:center; position:relative; padding:30px;}
.panel .inner{max-width:900px; text-align:center;}
.panel.fade{opacity:0; transition:opacity .6s ease;}
.panel.visible{opacity:1;}
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="../../">SLG</a></div></header>
<main>
  <section class="panel fade" id="p1"><div class="inner"><h2>Welcome to Brand Showcase</h2><p>섹션별로 멈추고 페이드 인/아웃 됩니다.</p></div></section>
  <section class="panel fade" id="p2"><div class="inner"><h2>Feature Highlight</h2><p>SVG motion과 텍스트 애니메이션.</p></div></section>
  <section class="panel fade" id="p3"><div class="inner"><h2>Call to Action</h2><p>마지막 섹션</p></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const panels = document.querySelectorAll('.panel');
panels.forEach((panel) => {
  ScrollTrigger.create({
    trigger: panel,
    start: "top top",
    end: "+=100%",
    pin: true,
    onEnter: () => panel.classList.add('visible'),
    onLeaveBack: () => panel.classList.remove('visible')
  });
});
</script>
</body>
</html>
